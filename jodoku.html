<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jonas :: Hauptseite</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
  :root {
    --soil-dark: #2b2118;
    --soil: #4a3826;
    --parchment: #f2e6c9;
    --parchment-dim: #e4d3a8;
    --wheat: #d4a949;
    --barn-red: #a8402f;
    --leaf: #5c7a4a;
    --leaf-dark: #3f5934;
    --sky: #8fb3a8;
    --ink: #2b2118;
    --line-thin: rgba(43,33,24,0.18);
    --line-thick: rgba(43,33,24,0.55);
    --given-bg: #e9dcb8;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-display: var(--font-sans);
    --font-body: var(--font-sans);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #6b8a5a 0%, var(--soil) 55%, var(--soil-dark) 100%);
    font-family: var(--font-body);
    color: var(--parchment);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 60px;
  }

  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 960px;
    margin: 0 auto 12px;
    padding: 1rem 1rem 0.75rem;
  }

  .logo {
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--parchment);
    font-family: var(--font-display);
    letter-spacing: 0.03em;
    line-height: 1.2;
  }
  .logo .dot { color: var(--wheat); }

  .site-header nav a {
    margin-left: 1.5rem;
    color: var(--parchment-dim);
    transition: color 0.15s ease;
  }
  .site-header nav a:hover { color: var(--parchment); }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 6px;
    letter-spacing: 0.5px;
    color: var(--parchment);
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--parchment-dim);
    line-height: 1.5;
    opacity: 0.85;
  }

  .layout {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .level-bar {
    background: linear-gradient(160deg, #5a4530, #3a2c1e);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .level-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--parchment-dim);
  }

  .level-bar-row label[for="levelSelect"] {
    font-weight: 600;
    color: var(--parchment);
  }

  #levelSelect {
    background: var(--parchment);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
    min-width: 180px;
  }

  #reloadLevelsBtn, .upload-btn {
    background: var(--soil);
    color: var(--parchment);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  #reloadLevelsBtn:hover, .upload-btn:hover { background: #5c4630; }

  .upload-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .upload-btn input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .level-bar-hint code {
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .difficulty-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: rgba(212,169,73,0.18);
    color: var(--wheat);
    border: 1px solid rgba(212,169,73,0.4);
  }
  .difficulty-badge.diff-easy   { background: rgba(143,214,106,0.15); color: #8fd66a; border-color: rgba(143,214,106,0.4); }
  .difficulty-badge.diff-medium { background: rgba(212,169,73,0.18); color: var(--wheat); border-color: rgba(212,169,73,0.4); }
  .difficulty-badge.diff-hard   { background: rgba(230,140,90,0.18); color: #e68c5a; border-color: rgba(230,140,90,0.4); }
  .difficulty-badge.diff-expert { background: rgba(168,64,47,0.22); color: #e69a8c; border-color: rgba(168,64,47,0.5); }

  /* --- Board --- */
  .board-wrap {
    background: linear-gradient(160deg, #5a4530, #3a2c1e);
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.04);
  }

  .board {
    display: grid;
    background: var(--soil-dark);
    border: 3px solid var(--soil-dark);
    border-radius: 4px;
    overflow: hidden;
  }

  .cell {
    position: relative;
    background: var(--parchment);
    border: 1px solid var(--line-thin);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    cursor: pointer;
    user-select: none;
    transition: background 0.12s ease;
  }

  .cell .cell-icon {
    width: 78%;
    height: 78%;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.85rem, 2.4vw, 1.1rem);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    pointer-events: none;
  }

  .cell .cell-icon.cell-icon-emoji {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: normal;
    text-shadow: none;
    color: initial;
  }

  .cell.given {
    background: var(--given-bg);
    cursor: default;
  }

  .cell:not(.given):hover {
    background: #fbf3dc;
  }

  .cell.selected {
    background: #fff3c9;
    box-shadow: inset 0 0 0 3px var(--wheat);
    z-index: 2;
  }

  .cell.region-border-right { border-right: 3px solid var(--soil-dark); }
  .cell.region-border-bottom { border-bottom: 3px solid var(--soil-dark); }

  .cell.conflict {
    background: #f3d2c9;
  }

  .cell .given-star {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 0.6rem;
    color: var(--wheat);
    pointer-events: none;
  }

  /* --- Symbol picker --- */
  .picker {
    background: linear-gradient(160deg, #5a4530, #3a2c1e);
    border-radius: 10px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 200px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }

  .picker button {
    aspect-ratio: 1;
    border: none;
    border-radius: 8px;
    background: var(--parchment);
    font-size: 1.6rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, background 0.12s ease;
    color: var(--ink);
    font-weight: 700;
  }

  .picker button.picker-btn-color {
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    font-size: 0.9rem;
  }

  .picker button:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
  }

  .picker button.erase {
    grid-column: span 3;
    background: var(--barn-red);
    color: var(--parchment);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .picker button.erase:hover { background: #8c3325; }

  .picker button.fully-placed {
    box-shadow: inset 0 0 0 3px var(--barn-red);
  }

  .picker button.notes-active {
    box-shadow: inset 0 0 0 3px var(--wheat);
  }

  .cell.same-symbol {
    outline: 3px solid var(--barn-red);
    outline-offset: -3px;
    z-index: 1;
  }

  .notes-grid {
    width: 100%;
    height: 100%;
    display: grid;
    align-items: center;
    justify-items: center;
    padding: 3px;
    pointer-events: none;
  }
  .notes-grid .note-icon {
    font-size: 0.55rem;
    line-height: 1;
    color: var(--ink);
    opacity: 0.75;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 2px;
    font-weight: 700;
  }
  .notes-grid .note-icon.note-icon-emoji {
    font-size: 0.7rem;
    font-weight: normal;
  }

  #notesBtn.active {
    background: var(--wheat);
    color: var(--ink);
    font-weight: 600;
  }

  /* --- Sidebar (goal tracker) --- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 260px;
  }

  .board-plus-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .goal-board {
    background: linear-gradient(160deg, #6b4a2f, #4a3320);
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .goal-board.negative-goal-board {
    background: linear-gradient(160deg, #5a3428, #3a231c);
  }

  .goal-item {
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .goal-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .goal-title {
    font-family: var(--font-display);
    font-size: 0.95rem;
    margin: 0 0 8px;
    color: var(--wheat);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .goal-title.negative-title { color: #e69a8c; }

  .goal-chain-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    font-size: 0.6rem;
    font-weight: 700;
    color: #fff;
  }
  .goal-chain-arrow {
    color: var(--parchment-dim);
    font-size: 0.8rem;
  }
  .goal-chain-plus {
    color: var(--parchment-dim);
    font-size: 0.8rem;
  }

  .goal-progress {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--font-display);
    margin-bottom: 6px;
  }

  .goal-progress .count {
    font-size: 1.8rem;
    color: var(--parchment);
    line-height: 1;
  }
  .goal-progress .count.exceeded { color: #e69a8c; }
  .goal-progress .of {
    font-size: 1rem;
    color: var(--parchment-dim);
  }

  .goal-desc {
    font-size: 0.8rem;
    color: var(--parchment-dim);
    line-height: 1.5;
  }

  .goal-bar {
    margin-top: 8px;
    height: 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .goal-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--leaf), var(--wheat));
    width: 0%;
    transition: width 0.3s ease;
  }
  .goal-bar-fill.done {
    background: linear-gradient(90deg, var(--leaf), #8fd66a);
  }
  .goal-bar-fill.negative {
    background: linear-gradient(90deg, var(--leaf), var(--wheat));
  }
  .goal-bar-fill.negative.exceeded {
    background: linear-gradient(90deg, var(--barn-red), #e69a8c);
  }

  .status-board {
    background: linear-gradient(160deg, #6b4a2f, #4a3320);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--parchment-dim);
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .status-board strong { color: var(--parchment); }

  .hint-board {
    background: linear-gradient(160deg, #6b4a2f, #4a3320);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.85rem;
    color: var(--parchment-dim);
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    text-align: center;
  }
  .hint-count-label strong { color: var(--wheat); font-size: 1rem; }

  .win-banner-hints {
    display: block;
    font-size: 0.85rem;
    margin-top: 6px;
    color: var(--parchment-dim);
    font-family: var(--font-body);
  }

  .cell.hint-highlight .cell-icon {
    animation: hintPulse 1.1s ease;
  }
  @keyframes hintPulse {
    0%   { box-shadow: 0 0 0 0 rgba(212,169,73,0.9); }
    60%  { box-shadow: 0 0 0 10px rgba(212,169,73,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,169,73,0); }
  }

  .win-banner {
    display: none;
    margin-top: 18px;
    background: var(--leaf-dark);
    color: var(--parchment);
    padding: 16px 20px;
    border-radius: 10px;
    text-align: center;
    font-family: var(--font-display);
    font-size: 1.2rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .win-banner.show { display: block; }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }
  .controls-row {
    display: flex;
    gap: 10px;
  }
  .controls button {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: var(--soil);
    color: var(--parchment);
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .controls button:hover { background: #5c4630; }

  #hintBtn {
    background: var(--wheat);
    color: var(--ink);
    font-weight: 600;
  }
  #hintBtn:hover { background: #e0b95e; }
  #hintBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .legend {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    font-size: 0.8rem;
    color: var(--parchment-dim);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .legend-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex: none;
  }

  /* --- Story-Popup --- */
  .story-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 15, 10, 0.72);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .story-overlay.show { display: flex; }

  .story-modal {
    background: linear-gradient(160deg, #6b4a2f, #3a2c1e);
    border-radius: 14px;
    padding: 26px 28px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.06);
    text-align: left;
  }
  .story-modal-kicker {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--wheat);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .story-modal-title {
    font-family: var(--font-display);
    font-size: 1.3rem;
    margin: 0 0 12px;
    color: var(--parchment);
  }
  .story-modal-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--parchment-dim);
    white-space: pre-wrap;
    margin-bottom: 20px;
  }
  .story-modal-actions {
    display: flex;
    justify-content: flex-end;
  }
  .story-modal-actions button {
    background: var(--wheat);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .story-modal-actions button:hover { background: #e0b95e; }

  @media (max-width: 640px) {
    .layout { flex-direction: column; align-items: center; }
    .sidebar { width: 100%; max-width: 320px; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <a href="/" class="logo">jonas<span class="dot">.</span></a>
    <nav>
      <a href="index.html#projekte">Projekte</a>
      <a href="index.html#playground">Playground</a>
      <a href="jodoku.html">Jodoku</a>
    </nav>
  </header>
  <h1>Jodoku</h1>
  <p class="subtitle" id="subtitle">Fülle die Felder so aus, dass jede Figur genau einmal pro Zeile, Spalte und Region vorkommt.</p>
<div class="level-bar" id="levelBar">
  <div class="level-bar-row">
    <label for="levelSelect">Level:</label>
    <select id="levelSelect"></select>
    
    <span class="difficulty-badge" id="difficultyBadge" style="display:none;"></span>
  </div>
  
</div>

<div class="layout">

  <div class="board-plus-picker">
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="picker" id="picker"></div>
  </div>

  <div class="sidebar">
    <div class="goal-board" id="goalBoard">
      <!-- wird dynamisch mit 1..n positiven Zielen gefuellt -->
    </div>

    <div class="goal-board negative-goal-board" id="negativeGoalBoard" style="display:none;">
      <!-- wird dynamisch mit 1..n negativen Zielen gefuellt -->
    </div>

    <div class="status-board">
      <strong>Legende</strong>
      <div class="legend" id="legend"></div>
    </div>

    <div class="hint-board">
      <span class="hint-count-label">💡 Hinweise genutzt: <strong id="hintCount">0</strong></span>
    </div>

    <div class="controls">
      <div class="controls-row">
        <button id="hintBtn">💡 Hinweis</button>
        <button id="notesBtn" title="Notizen: Symbole klein als Kandidaten in eine Zelle eintragen, statt sie zu setzen">✏️ Notizen</button>
      </div>
      <div class="controls-row">
        <button id="checkBtn">Prüfen</button>
        <button id="resetBtn">Zurücksetzen</button>
      </div>
    </div>

    <div class="win-banner" id="winBanner">🎉 Hof komplett! Alle Regeln und Ziele erfüllt.</div>
  </div>

</div>

<div class="story-overlay" id="storyOverlay">
  <div class="story-modal">
    <div class="story-modal-kicker" id="storyKicker">Hofgeflüster</div>
    <h3 class="story-modal-title" id="storyTitle">Willkommen</h3>
    <div class="story-modal-text" id="storyText"></div>
    <div class="story-modal-actions">
      <button id="storyContinueBtn">Weiter</button>
    </div>
  </div>
</div>

<script>
// --- Level-Verwaltung -------------------------------------------------
const LEVEL_MANIFEST = [
  'levels/level_01.json',
  'levels/level_02.json',
  'levels/level_03.json',
];

// Eingebautes Fallback-Level (altes Einzelziel-Format, wird beim Laden
// automatisch in das neue goals[]-Format konvertiert).
const FALLBACK_LEVEL = {
  id: 'fallback',
  title: 'Beispielhof (eingebaut)',
  size: 6,
  region_rows: 2,
  region_cols: 3,
  symbols: [
    { id: 'wald',      name: 'Wald',      color: '#2f6b3a', abbr: 'WA', icon: '🌲' },
    { id: 'saegewerk', name: 'Sägewerk',  color: '#8a5a2b', abbr: 'SW', icon: '🪚' },
    { id: 'feld',      name: 'Feld',      color: '#c9a227', abbr: 'FE', icon: '🌾' },
    { id: 'scheune',   name: 'Scheune',   color: '#a8402f', abbr: 'SC', icon: '🏚️' },
    { id: 'brunnen',   name: 'Brunnen',   color: '#3d7a91', abbr: 'BR', icon: '💧' },
    { id: 'haus',      name: 'Haus',      color: '#6b4a2f', abbr: 'HA', icon: '🏠' },
  ],
  solution: [
    ['haus','saegewerk','wald','brunnen','feld','scheune'],
    ['brunnen','feld','scheune','haus','wald','saegewerk'],
    ['scheune','haus','saegewerk','wald','brunnen','feld'],
    ['wald','brunnen','feld','saegewerk','scheune','haus'],
    ['feld','wald','haus','scheune','saegewerk','brunnen'],
    ['saegewerk','scheune','brunnen','feld','haus','wald'],
  ],
  givens: [
    [1,0],[1,2],[1,3],[1,5],
    [2,1],[2,3],
    [3,0],[3,3],
    [4,1],[4,5],
    [5,1],[5,4],
  ],
  goals: [
    { chain: ['wald','saegewerk'], target_count: 4 },
  ],
  negative_goals: [],
  story_intro: 'Willkommen auf deinem neuen Hof! Richte alles so ein, dass Wege und Gebäude zusammenpassen.',
  story_outro: 'Was für ein gelungener Hof! Die Tiere und Pflanzen fühlen sich sichtlich wohl.',
  difficulty: 'easy',
  verified_unique: true,
};

let N = 6;
let REGION_ROWS = 2;
let REGION_COLS = 3;
let SOLUTION = [];
let GIVEN_SET = new Set();
let SYMBOLS = [];
let SYM_BY_ID = {};
let GOALS = [];            // Liste von { chain: [id,...], target_count }
let NEGATIVE_GOALS = [];   // Liste von { symbols: [id,...], max_count }
let currentLevel = null;
let outroShown = false;

let grid = [];
let selected = null;
let hintsUsed = 0;
let notes = [];            // notes[r][c] = Set von Symbol-IDs (nur fuer leere Zellen relevant)
let notesMode = false;
let highlightSymbol = null; // Symbol, dessen Vorkommen gerade rot umrandet werden

// --- Level-Normalisierung ---------------------------------------------
// Alte Level-Dateien hatten evtl. noch "goal" (Einzahl, ein Paar) statt
// "goals" (Liste von Ketten), oder gar kein negative_goals/story-Feld.
// Wird hier transparent hochkonvertiert, damit alte Level weiter funktionieren.
function normalizeLevel(data) {
  const normalized = { ...data };
  if (!normalized.goals) {
    if (normalized.goal) {
      normalized.goals = [{ chain: [normalized.goal.symbol_a, normalized.goal.symbol_b], target_count: normalized.goal.target_count }];
    } else {
      normalized.goals = [];
    }
  }
  if (!normalized.negative_goals) {
    normalized.negative_goals = [];
  }
  if (!normalized.symbols) {
    // Fallback auf die alten sechs Standard-Symbole mit Icon -> Farbe/Kuerzel ersetzt
    normalized.symbols = FALLBACK_LEVEL.symbols;
  }
  normalized.story_intro = normalized.story_intro || null;
  normalized.story_outro = normalized.story_outro || null;
  normalized.difficulty = normalized.difficulty || null;
  return normalized;
}

async function fetchJson(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function discoverLevels() {
  const found = [];
  for (const path of LEVEL_MANIFEST) {
    try {
      const data = await fetchJson(path);
      found.push({ path, data: normalizeLevel(data) });
    } catch (e) {
      console.warn('Level konnte nicht geladen werden:', path, e.message);
    }
  }
  return found;
}

function populateLevelSelect(levels) {
  const select = document.getElementById('levelSelect');
  select.innerHTML = '';
  if (levels.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = 'Beispielhof (eingebaut) — kein Ordnerzugriff';
    opt.value = 'fallback';
    select.appendChild(opt);
    return;
  }
  levels.forEach(({ path, data }) => {
    const opt = document.createElement('option');
    opt.value = path;
    opt.textContent = data.title || path;
    select.appendChild(opt);
  });
}

// Bevorzugt das Emoji (icon), faellt sonst auf das Kuerzel (abbr) zurueck.
// Spaeter kann hier zusaetzlich sym.image (Pixel-Art-Sprite) beruecksichtigt
// werden, sobald das Feature gebaut ist.
function symbolDisplay(sym) {
  if (!sym) return '?';
  return sym.icon || sym.abbr || '?';
}

function chainToLabelHtml(chain) {
  return chain.map((sid, i) => {
    const sym = SYM_BY_ID[sid];
    const icon = `<span class="goal-chain-icon" style="background:${sym?.color || '#666'}">${symbolDisplay(sym)}</span>`;
    return i < chain.length - 1 ? icon + '<span class="goal-chain-arrow">→</span>' : icon;
  }).join('');
}

function chainToText(chain) {
  return chain.map(sid => SYM_BY_ID[sid]?.name || sid).join(' → ');
}

function symbolSetToLabelHtml(symbols) {
  return symbols.map((sid, i) => {
    const sym = SYM_BY_ID[sid];
    const icon = `<span class="goal-chain-icon" style="background:${sym?.color || '#666'}">${symbolDisplay(sym)}</span>`;
    return i < symbols.length - 1 ? icon + '<span class="goal-chain-plus">+</span>' : icon;
  }).join('');
}

function symbolSetToText(symbols) {
  return symbols.map(sid => SYM_BY_ID[sid]?.name || sid).join(' + ');
}

function renderGoalBoard() {
  const board = document.getElementById('goalBoard');
  board.innerHTML = '';

  if (GOALS.length === 0) {
    board.innerHTML = '<div class="goal-desc">Für dieses Level sind keine positiven Nachbarschafts-Ziele definiert.</div>';
    return;
  }

  GOALS.forEach((goal, idx) => {
    const item = document.createElement('div');
    item.className = 'goal-item';
    item.innerHTML = `
      <div class="goal-title">${chainToLabelHtml(goal.chain)}</div>
      <div class="goal-progress">
        <span class="count" id="goalCount_${idx}">0</span><span class="of">/ ${goal.target_count}</span>
      </div>
      <div class="goal-desc">Kette ${chainToText(goal.chain)} muss ${goal.target_count}x im Grid vorkommen (Glieder jeweils orthogonal benachbart, darf sich schlängeln).</div>
      <div class="goal-bar"><div class="goal-bar-fill" id="goalBar_${idx}"></div></div>
    `;
    board.appendChild(item);
  });
}

function renderNegativeGoalBoard() {
  const board = document.getElementById('negativeGoalBoard');
  board.innerHTML = '';

  if (!NEGATIVE_GOALS || NEGATIVE_GOALS.length === 0) {
    board.style.display = 'none';
    return;
  }
  board.style.display = 'flex';

  NEGATIVE_GOALS.forEach((ng, idx) => {
    const item = document.createElement('div');
    item.className = 'goal-item';
    item.innerHTML = `
      <div class="goal-title negative-title">🚫 ${symbolSetToLabelHtml(ng.symbols)}</div>
      <div class="goal-progress">
        <span class="count" id="negGoalCount_${idx}">0</span><span class="of">/ max. ${ng.max_count}</span>
      </div>
      <div class="goal-desc">${symbolSetToText(ng.symbols)} dürfen insgesamt höchstens ${ng.max_count}x orthogonal nebeneinander liegen.</div>
      <div class="goal-bar"><div class="goal-bar-fill negative" id="negGoalBar_${idx}"></div></div>
    `;
    board.appendChild(item);
  });
}

function renderDifficultyBadge() {
  const badge = document.getElementById('difficultyBadge');
  const diff = currentLevel?.difficulty;
  if (!diff) {
    badge.style.display = 'none';
    return;
  }
  const labels = { easy: '🟢 Leicht', medium: '🟡 Mittel', hard: '🟠 Schwer', expert: '🔴 Experte' };
  badge.textContent = labels[diff] || diff;
  badge.className = 'difficulty-badge diff-' + diff;
  badge.style.display = 'inline-flex';
}

// --- Story-Popup --------------------------------------------------------
function showStoryModal(text, kicker) {
  if (!text) return;
  document.getElementById('storyKicker').textContent = kicker || 'Hofgeflüster';
  document.getElementById('storyTitle').textContent = currentLevel?.title || 'Hofgeflüster';
  document.getElementById('storyText').textContent = text;
  document.getElementById('storyOverlay').classList.add('show');
}

function hideStoryModal() {
  document.getElementById('storyOverlay').classList.remove('show');
}

document.getElementById('storyContinueBtn').addEventListener('click', hideStoryModal);
document.getElementById('storyOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'storyOverlay') hideStoryModal();
});

function applyLevel(levelData) {
  currentLevel = normalizeLevel(levelData);
  N = currentLevel.size || 6;
  REGION_ROWS = currentLevel.region_rows || 2;
  REGION_COLS = currentLevel.region_cols || 3;
  SOLUTION = currentLevel.solution;
  GIVEN_SET = new Set(currentLevel.givens.map(([r,c]) => r+'_'+c));
  SYMBOLS = currentLevel.symbols;
  SYM_BY_ID = Object.fromEntries(SYMBOLS.map(s => [s.id, s]));
  GOALS = currentLevel.goals;
  NEGATIVE_GOALS = currentLevel.negative_goals;
  outroShown = false;

  const subtitleEl = document.getElementById('subtitle');
  if (subtitleEl) {
    const goalSummary = GOALS.map(g => `${chainToText(g.chain)} (${g.target_count}x)`).join(' · ');
    const negSummary = NEGATIVE_GOALS.map(ng => `${symbolSetToText(ng.symbols)} (max. ${ng.max_count}x)`).join(' · ');
    let text = 'Fülle jedes Feld so ein, dass jede Figur genau einmal pro Zeile, Spalte und Region vorkommt.';
    if (GOALS.length) text += ` Erreiche: ${goalSummary}.`;
    if (NEGATIVE_GOALS.length) text += ` Vermeide: ${negSummary}.`;
    subtitleEl.textContent = text;
  }

  renderGoalBoard();
  renderNegativeGoalBoard();
  renderDifficultyBadge();

  grid = SOLUTION.map((row, r) => row.map((val, c) => GIVEN_SET.has(r+'_'+c) ? val : null));
  notes = grid.map(row => row.map(() => new Set()));
  notesMode = false;
  highlightSymbol = null;
  const notesBtnEl = document.getElementById('notesBtn');
  if (notesBtnEl) notesBtnEl.classList.remove('active');
  selected = null;
  hintsUsed = 0;
  updateHintCountDisplay();
  renderBoard();
  renderPicker();
  renderLegend();
  updateAll();
  document.getElementById('winBanner').classList.remove('show');

  if (currentLevel.story_intro) {
    showStoryModal(currentLevel.story_intro, 'Zu Beginn');
  }
}

async function initLevels() {
  const levels = await discoverLevels();
  populateLevelSelect(levels);

  const select = document.getElementById('levelSelect');
  if (levels.length > 0) {
    select.value = levels[0].path;
    applyLevel(levels[0].data);
  } else {
    applyLevel(FALLBACK_LEVEL);
  }

  select.addEventListener('change', () => {
    const chosen = levels.find(l => l.path === select.value);
    if (chosen) applyLevel(chosen.data);
  });

  document.getElementById('reloadLevelsBtn').addEventListener('click', async () => {
    const refreshed = await discoverLevels();
    populateLevelSelect(refreshed);
    if (refreshed.length > 0) applyLevel(refreshed[0].data);
  });

  document.getElementById('levelFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        applyLevel(data);
        const opt = document.createElement('option');
        opt.value = 'uploaded:' + file.name;
        opt.textContent = (data.title || file.name) + ' (hochgeladen)';
        select.appendChild(opt);
        select.value = opt.value;
      } catch (err) {
        alert('Diese Datei konnte nicht als Level gelesen werden: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
}

function init() {
  initLevels();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${N}, minmax(clamp(28px, 8vw, 64px), 1fr))`;
  board.style.gridTemplateRows = `repeat(${N}, minmax(clamp(28px, 8vw, 64px), 1fr))`;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (GIVEN_SET.has(r+'_'+c)) cell.classList.add('given');
      if ((c+1) % REGION_COLS === 0 && c !== N-1) cell.classList.add('region-border-right');
      if ((r+1) % REGION_ROWS === 0 && r !== N-1) cell.classList.add('region-border-bottom');
      cell.addEventListener('click', () => onCellClick(r, c));
      board.appendChild(cell);
    }
  }
  refreshCells();
}

function refreshCells() {
  document.querySelectorAll('.cell').forEach(cellEl => {
    const r = +cellEl.dataset.r, c = +cellEl.dataset.c;
    const val = grid[r][c];
    cellEl.innerHTML = '';
    if (val) {
      const sym = SYM_BY_ID[val];
      const icon = document.createElement('div');
      icon.className = 'cell-icon';
      if (sym?.icon) {
        // Emoji ist selbst schon farbig - Hintergrund dezent halten
        icon.style.background = 'transparent';
        icon.classList.add('cell-icon-emoji');
      } else {
        icon.style.background = sym?.color || '#888';
      }
      icon.textContent = symbolDisplay(sym);
      cellEl.appendChild(icon);
    } else if (notes[r] && notes[r][c] && notes[r][c].size > 0) {
      cellEl.appendChild(renderNotesGrid(notes[r][c]));
    }
    if (GIVEN_SET.has(r+'_'+c)) {
      const star = document.createElement('span');
      star.className = 'given-star';
      star.textContent = '★';
      cellEl.appendChild(star);
    }
    cellEl.classList.toggle('selected', selected && selected.r === r && selected.c === c);
    cellEl.classList.toggle('same-symbol', highlightSymbol !== null && val === highlightSymbol);
  });
  markConflicts();
  updatePickerHighlights();
}

// Rendert die kleinen Kandidaten-Symbole ("Notizen") als Mini-Grid innerhalb
// einer leeren Zelle - wie bei anderen Sudoku-Apps ueblich, um sich zu
// markieren, welche Symbole in dieser Zelle noch moeglich sind.
function renderNotesGrid(noteSet) {
  const wrap = document.createElement('div');
  wrap.className = 'notes-grid';
  const cols = Math.ceil(Math.sqrt(SYMBOLS.length));
  wrap.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  SYMBOLS.forEach(sym => {
    const cellDiv = document.createElement('div');
    if (noteSet.has(sym.id)) {
      cellDiv.className = 'note-icon' + (sym.icon ? ' note-icon-emoji' : '');
      if (!sym.icon) cellDiv.style.background = sym.color;
      cellDiv.textContent = symbolDisplay(sym);
    }
    wrap.appendChild(cellDiv);
  });
  return wrap;
}

// Prueft, ob `symId` bereits in JEDER Region des Grids mindestens einmal
// vorkommt (hat also seine maximal moegliche Anzahl an Vorkommen erreicht).
function symbolFullyPlacedInEveryRegion(symId) {
  for (let br = 0; br < N; br += REGION_ROWS) {
    for (let bc = 0; bc < N; bc += REGION_COLS) {
      let present = false;
      for (let r = br; r < br + REGION_ROWS && !present; r++) {
        for (let c = bc; c < bc + REGION_COLS; c++) {
          if (grid[r][c] === symId) { present = true; break; }
        }
      }
      if (!present) return false;
    }
  }
  return true;
}

function updatePickerHighlights() {
  document.querySelectorAll('#picker button[data-sym-id]').forEach(btn => {
    const symId = btn.dataset.symId;
    btn.classList.toggle('fully-placed', symbolFullyPlacedInEveryRegion(symId));
  });
}

function onCellClick(r, c) {
  const val = grid[r][c];
  highlightSymbol = val !== null ? val : null;
  if (GIVEN_SET.has(r+'_'+c)) {
    // Vorgaben sind nicht editierbar, aber anklickbar, um gleiche Symbole hervorzuheben
    selected = null;
    refreshCells();
    return;
  }
  selected = { r, c };
  refreshCells();
}

function renderPicker() {
  const picker = document.getElementById('picker');
  picker.innerHTML = '';
  SYMBOLS.forEach(sym => {
    const btn = document.createElement('button');
    btn.textContent = symbolDisplay(sym);
    btn.title = sym.name;
    btn.dataset.symId = sym.id;
    btn.style.background = sym.icon ? 'var(--parchment)' : sym.color;
    if (!sym.icon) btn.classList.add('picker-btn-color');
    btn.addEventListener('click', () => {
      highlightSymbol = sym.id;
      placeSymbol(sym.id);
    });
    picker.appendChild(btn);
  });
  const erase = document.createElement('button');
  erase.className = 'erase';
  erase.textContent = 'Löschen';
  erase.addEventListener('click', () => placeSymbol(null));
  picker.appendChild(erase);
  updatePickerHighlights();
}

function placeSymbol(symId) {
  if (!selected) return;
  const { r, c } = selected;
  if (GIVEN_SET.has(r+'_'+c)) return;

  if (notesMode) {
    if (symId === null) {
      // Löschen im Notizen-Modus: alle Notizen dieser Zelle entfernen
      notes[r][c].clear();
    } else if (grid[r][c] === null) {
      // Kandidat toggeln, statt den tatsaechlichen Wert zu setzen
      if (notes[r][c].has(symId)) notes[r][c].delete(symId);
      else notes[r][c].add(symId);
    }
    refreshCells();
    return;
  }

  grid[r][c] = symId;
  if (symId !== null) notes[r][c].clear();
  refreshCells();
  updateAll();
}

function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  SYMBOLS.forEach(sym => {
    const span = document.createElement('span');
    const swatch = document.createElement('span');
    swatch.className = 'legend-swatch';
    swatch.style.background = sym.color;
    span.appendChild(swatch);
    const label = sym.icon ? `${sym.icon} ${sym.name}` : sym.name;
    span.appendChild(document.createTextNode(label));
    legend.appendChild(span);
  });
}

// --- Rule checking ---
function markConflicts() {
  const conflictCells = new Set();

  for (let r = 0; r < N; r++) {
    const seen = {};
    for (let c = 0; c < N; c++) {
      const v = grid[r][c];
      if (!v) continue;
      if (seen[v] !== undefined) { conflictCells.add(r+'_'+c); conflictCells.add(r+'_'+seen[v]); }
      else seen[v] = c;
    }
  }
  for (let c = 0; c < N; c++) {
    const seen = {};
    for (let r = 0; r < N; r++) {
      const v = grid[r][c];
      if (!v) continue;
      if (seen[v] !== undefined) { conflictCells.add(r+'_'+c); conflictCells.add(seen[v]+'_'+c); }
      else seen[v] = r;
    }
  }
  for (let br = 0; br < N; br += REGION_ROWS) {
    for (let bc = 0; bc < N; bc += REGION_COLS) {
      const seen = {};
      for (let r = br; r < br+REGION_ROWS; r++) {
        for (let c = bc; c < bc+REGION_COLS; c++) {
          const v = grid[r][c];
          if (!v) continue;
          if (seen[v]) { conflictCells.add(r+'_'+c); conflictCells.add(seen[v]); }
          else seen[v] = r+'_'+c;
        }
      }
    }
  }

  document.querySelectorAll('.cell').forEach(cellEl => {
    const key = cellEl.dataset.r + '_' + cellEl.dataset.c;
    cellEl.classList.toggle('conflict', conflictCells.has(key));
  });
}

// Zaehlt, wie oft eine Kette (Liste von Symbol-IDs) im Grid als
// zusammenhaengender, orthogonal benachbarter Pfad vorkommt (darf sich
// schlaengeln, muss keine gerade Linie sein). Analog zu chain_count in
// sudoku_core.py.
function neighborsOf(r, c) {
  const result = [];
  if (r > 0) result.push([r-1, c]);
  if (r < N-1) result.push([r+1, c]);
  if (c > 0) result.push([r, c-1]);
  if (c < N-1) result.push([r, c+1]);
  return result;
}

function countChain(chain) {
  if (chain.length < 2) return 0;
  let count = 0;

  function dfs(path, usedCells) {
    const step = path.length;
    if (step === chain.length) {
      count++;
      return;
    }
    const [lr, lc] = path[path.length - 1];
    const neededSymbol = chain[step];
    for (const [nr, nc] of neighborsOf(lr, lc)) {
      const key = nr + '_' + nc;
      if (usedCells.has(key)) continue;
      if (grid[nr][nc] === neededSymbol) {
        path.push([nr, nc]);
        usedCells.add(key);
        dfs(path, usedCells);
        path.pop();
        usedCells.delete(key);
      }
    }
  }

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (grid[r][c] === chain[0]) {
        dfs([[r, c]], new Set([r + '_' + c]));
      }
    }
  }

  return count;
}

// Zaehlt orthogonale Nachbarschaften zwischen Zellen, die BEIDE ein Symbol
// aus `symbols` enthalten (auch zweimal dasselbe Symbol) - Gegenstueck zu
// count_negative_adjacency() in sudoku_core.py.
function countNegativeAdjacency(symbols) {
  return countNegativeAdjacencyOn(grid, symbols);
}

function countNegativeAdjacencyOn(g, symbols) {
  const symset = new Set(symbols);
  let count = 0;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const v = g[r][c];
      if (v === null || v === undefined || !symset.has(v)) continue;
      if (c + 1 < N) {
        const v2 = g[r][c+1];
        if (v2 !== null && v2 !== undefined && symset.has(v2)) count++;
      }
      if (r + 1 < N) {
        const v2 = g[r+1][c];
        if (v2 !== null && v2 !== undefined && symset.has(v2)) count++;
      }
    }
  }
  return count;
}

function isFull() {
  return grid.every(row => row.every(v => v !== null));
}

function hasAnyConflict() {
  return document.querySelectorAll('.cell.conflict').length > 0;
}

function negativeGoalsExceeded() {
  return NEGATIVE_GOALS.some(ng => countNegativeAdjacency(ng.symbols) > ng.max_count);
}

// ---------------------------------------------------------------------
// Hinweis-Funktion: portiert dieselben "menschlichen" Logik-Techniken wie
// sudoku_core.py - Naked/Hidden Single, Locked Candidates (Pointing/
// Claiming), Naked/Hidden Pair & Triple, X-Wing, Negative-Ziel-Pruning und
// Ziel-Deduktion (inkl. derselben Einschraenkung: Ziel-Deduktion darf nur
// greifen, wenn wenige leere Zellen uebrig sind - Endspiel-Faelle, die ein
// Mensch tatsaechlich durchprobieren koennte, sonst waere es verstecktes
// Brute-Force-Raten).
// ---------------------------------------------------------------------

function candidatesGridOn(g, eliminated) {
  const cands = {};
  const allIds = SYMBOLS.map(s => s.id);
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (g[r][c] !== null) continue;
      const used = new Set();
      for (let cc = 0; cc < N; cc++) if (g[r][cc] !== null) used.add(g[r][cc]);
      for (let rr = 0; rr < N; rr++) if (g[rr][c] !== null) used.add(g[rr][c]);
      const br = Math.floor(r / REGION_ROWS) * REGION_ROWS;
      const bc = Math.floor(c / REGION_COLS) * REGION_COLS;
      for (let rr = br; rr < br + REGION_ROWS; rr++)
        for (let cc = bc; cc < bc + REGION_COLS; cc++)
          if (g[rr][cc] !== null) used.add(g[rr][cc]);
      const key = r + '_' + c;
      cands[key] = allIds.filter(id => !used.has(id) && !(eliminated && eliminated.has(key + '_' + id)));
    }
  }
  return cands;
}

// Bleibt fuer Abwaertskompatibilitaet/eigene Aufrufe erhalten.
function candidatesGrid() {
  return candidatesGridOn(grid, null);
}

function allUnitsJS() {
  const units = [];
  for (let r = 0; r < N; r++) { const u = []; for (let c = 0; c < N; c++) u.push([r, c]); units.push(u); }
  for (let c = 0; c < N; c++) { const u = []; for (let r = 0; r < N; r++) u.push([r, c]); units.push(u); }
  for (let br = 0; br < N; br += REGION_ROWS) {
    for (let bc = 0; bc < N; bc += REGION_COLS) {
      const u = [];
      for (let r = br; r < br + REGION_ROWS; r++) for (let c = bc; c < bc + REGION_COLS; c++) u.push([r, c]);
      units.push(u);
    }
  }
  return units;
}

function combinationsOf(arr, k) {
  const result = [];
  const combo = [];
  function rec(start) {
    if (combo.length === k) { result.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) {
      combo.push(arr[i]);
      rec(i + 1);
      combo.pop();
    }
  }
  rec(0);
  return result;
}

function rowOkOn(g, r) {
  const vals = g[r].filter(v => v !== null);
  return vals.length === new Set(vals).size;
}
function colOkOn(g, c) {
  const vals = [];
  for (let r = 0; r < N; r++) if (g[r][c] !== null) vals.push(g[r][c]);
  return vals.length === new Set(vals).size;
}
function boxOkOn(g, r, c) {
  const br = Math.floor(r / REGION_ROWS) * REGION_ROWS;
  const bc = Math.floor(c / REGION_COLS) * REGION_COLS;
  const vals = [];
  for (let rr = br; rr < br + REGION_ROWS; rr++)
    for (let cc = bc; cc < bc + REGION_COLS; cc++)
      if (g[rr][cc] !== null) vals.push(g[rr][cc]);
  return vals.length === new Set(vals).size;
}

function countChainOn(g, chain) {
  if (chain.length < 2) return 0;
  let count = 0;
  function dfs(path, usedCells) {
    const step = path.length;
    if (step === chain.length) { count++; return; }
    const [lr, lc] = path[path.length - 1];
    const neededSymbol = chain[step];
    for (const [nr, nc] of neighborsOf(lr, lc)) {
      const key = nr + '_' + nc;
      if (usedCells.has(key)) continue;
      if (g[nr][nc] === neededSymbol) {
        path.push([nr, nc]);
        usedCells.add(key);
        dfs(path, usedCells);
        path.pop();
        usedCells.delete(key);
      }
    }
  }
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (g[r][c] === chain[0]) {
        dfs([[r, c]], new Set([r + '_' + c]));
      }
    }
  }
  return count;
}

function goalsSatisfiedOn(g, goals, negativeGoals) {
  const posOk = goals.every(goal => countChainOn(g, goal.chain) === goal.target_count);
  if (!posOk) return false;
  if (!negativeGoals) return true;
  return negativeGoals.every(ng => countNegativeAdjacencyOn(g, ng.symbols) <= ng.max_count);
}

// --- Naked Single / Hidden Single (Stufe 1) ---
function applyNakedSingleOn(g, eliminated) {
  const cands = candidatesGridOn(g, eliminated);
  for (const key in cands) {
    const opts = cands[key];
    if (opts.length === 1) {
      const [r, c] = key.split('_').map(Number);
      g[r][c] = opts[0];
      return { r, c, value: opts[0] };
    }
    if (opts.length === 0) return 'contradiction';
  }
  return null;
}

function applyHiddenSingleOn(g, eliminated) {
  const cands = candidatesGridOn(g, eliminated);
  const symbolIds = SYMBOLS.map(s => s.id);
  for (const cells of allUnitsJS()) {
    for (const v of symbolIds) {
      const spots = cells.filter(([r, c]) => g[r][c] === null && (cands[r + '_' + c] || []).includes(v));
      if (spots.length === 1) {
        const [r, c] = spots[0];
        g[r][c] = v;
        return { r, c, value: v };
      }
    }
  }
  return null;
}

// --- Locked Candidates: Pointing/Claiming (Stufe 2) ---
function applyLockedCandidatesOn(g, eliminated) {
  const cands = candidatesGridOn(g, eliminated);
  const symbolIds = SYMBOLS.map(s => s.id);

  const boxes = [];
  for (let br = 0; br < N; br += REGION_ROWS) {
    for (let bc = 0; bc < N; bc += REGION_COLS) {
      const box = [];
      for (let r = br; r < br + REGION_ROWS; r++) for (let c = bc; c < bc + REGION_COLS; c++) box.push([r, c]);
      boxes.push(box);
    }
  }

  for (const box of boxes) {
    const bset = new Set(box.map(([r, c]) => r + '_' + c));
    for (const v of symbolIds) {
      const spots = box.filter(([r, c]) => g[r][c] === null && (cands[r + '_' + c] || []).includes(v));
      if (spots.length < 2) continue;
      const rows = new Set(spots.map(([r]) => r));
      const cols = new Set(spots.map(([, c]) => c));
      if (rows.size === 1) {
        const r = [...rows][0];
        for (let c = 0; c < N; c++) {
          if (!bset.has(r + '_' + c) && g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) {
            const key = r + '_' + c + '_' + v;
            if (!eliminated.has(key)) { eliminated.add(key); return true; }
          }
        }
      }
      if (cols.size === 1) {
        const c = [...cols][0];
        for (let r = 0; r < N; r++) {
          if (!bset.has(r + '_' + c) && g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) {
            const key = r + '_' + c + '_' + v;
            if (!eliminated.has(key)) { eliminated.add(key); return true; }
          }
        }
      }
    }
  }

  const lines = [];
  for (let r = 0; r < N; r++) { const l = []; for (let c = 0; c < N; c++) l.push([r, c]); lines.push(l); }
  for (let c = 0; c < N; c++) { const l = []; for (let r = 0; r < N; r++) l.push([r, c]); lines.push(l); }

  for (const line of lines) {
    const lineSet = new Set(line.map(([r, c]) => r + '_' + c));
    for (const v of symbolIds) {
      const spots = line.filter(([r, c]) => g[r][c] === null && (cands[r + '_' + c] || []).includes(v));
      if (spots.length < 2) continue;
      const boxesTouched = new Set(spots.map(([r, c]) => {
        const br = Math.floor(r / REGION_ROWS) * REGION_ROWS;
        const bc = Math.floor(c / REGION_COLS) * REGION_COLS;
        return br + '_' + bc;
      }));
      if (boxesTouched.size === 1) {
        const [br, bc] = [...boxesTouched][0].split('_').map(Number);
        for (let r = br; r < br + REGION_ROWS; r++) {
          for (let c = bc; c < bc + REGION_COLS; c++) {
            if (!lineSet.has(r + '_' + c) && g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) {
              const key = r + '_' + c + '_' + v;
              if (!eliminated.has(key)) { eliminated.add(key); return true; }
            }
          }
        }
      }
    }
  }
  return false;
}

// --- Naked Pair/Triple (Stufe 2/3) ---
function applyNakedSubsetOn(g, eliminated, size) {
  const cands = candidatesGridOn(g, eliminated);
  for (const cells of allUnitsJS()) {
    const emptyCells = cells.filter(([r, c]) => g[r][c] === null);
    const candidateCells = emptyCells.filter(([r, c]) => {
      const len = (cands[r + '_' + c] || []).length;
      return len > 1 && len <= size;
    });
    if (candidateCells.length < size) continue;
    for (const combo of combinationsOf(candidateCells, size)) {
      const union = new Set();
      for (const [r, c] of combo) (cands[r + '_' + c] || []).forEach(v => union.add(v));
      if (union.size !== size) continue;
      let changed = false;
      const comboSet = new Set(combo.map(([r, c]) => r + '_' + c));
      for (const [r, c] of emptyCells) {
        const key0 = r + '_' + c;
        if (comboSet.has(key0)) continue;
        for (const v of (cands[key0] || [])) {
          if (union.has(v)) {
            const key = key0 + '_' + v;
            if (!eliminated.has(key)) { eliminated.add(key); changed = true; }
          }
        }
      }
      if (changed) return true;
    }
  }
  return false;
}

// --- Hidden Pair/Triple (Stufe 2/3) ---
function applyHiddenSubsetOn(g, eliminated, size) {
  const cands = candidatesGridOn(g, eliminated);
  const symbolIds = SYMBOLS.map(s => s.id);
  for (const cells of allUnitsJS()) {
    const emptyCells = cells.filter(([r, c]) => g[r][c] === null);
    if (emptyCells.length <= size) continue;
    const valuePositions = {};
    for (const v of symbolIds) {
      const spots = emptyCells.filter(([r, c]) => (cands[r + '_' + c] || []).includes(v));
      if (spots.length > 1 && spots.length <= size) valuePositions[v] = spots;
    }
    const candidateValues = Object.keys(valuePositions);
    if (candidateValues.length < size) continue;
    for (const combo of combinationsOf(candidateValues, size)) {
      const unionCells = new Set();
      combo.forEach(v => valuePositions[v].forEach(([r, c]) => unionCells.add(r + '_' + c)));
      if (unionCells.size !== size) continue;
      let changed = false;
      for (const key0 of unionCells) {
        for (const v of (cands[key0] || [])) {
          if (!combo.includes(v)) {
            const key = key0 + '_' + v;
            if (!eliminated.has(key)) { eliminated.add(key); changed = true; }
          }
        }
      }
      if (changed) return true;
    }
  }
  return false;
}

// --- X-Wing (Stufe 3) ---
function applyXWingOn(g, eliminated) {
  const cands = candidatesGridOn(g, eliminated);
  const symbolIds = SYMBOLS.map(s => s.id);

  for (const v of symbolIds) {
    const rowSpots = {};
    for (let r = 0; r < N; r++) {
      const spots = [];
      for (let c = 0; c < N; c++) if (g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) spots.push(c);
      if (spots.length === 2) rowSpots[r] = spots;
    }
    const rows = Object.keys(rowSpots).map(Number);
    for (let i = 0; i < rows.length; i++) {
      for (let j = i + 1; j < rows.length; j++) {
        const r1 = rows[i], r2 = rows[j];
        if (rowSpots[r1][0] !== rowSpots[r2][0] || rowSpots[r1][1] !== rowSpots[r2][1]) continue;
        const cols = rowSpots[r1];
        let changed = false;
        for (const c of cols) {
          for (let r = 0; r < N; r++) {
            if (r === r1 || r === r2) continue;
            if (g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) {
              const key = r + '_' + c + '_' + v;
              if (!eliminated.has(key)) { eliminated.add(key); changed = true; }
            }
          }
        }
        if (changed) return true;
      }
    }
  }

  for (const v of symbolIds) {
    const colSpots = {};
    for (let c = 0; c < N; c++) {
      const spots = [];
      for (let r = 0; r < N; r++) if (g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) spots.push(r);
      if (spots.length === 2) colSpots[c] = spots;
    }
    const cols = Object.keys(colSpots).map(Number);
    for (let i = 0; i < cols.length; i++) {
      for (let j = i + 1; j < cols.length; j++) {
        const c1 = cols[i], c2 = cols[j];
        if (colSpots[c1][0] !== colSpots[c2][0] || colSpots[c1][1] !== colSpots[c2][1]) continue;
        const rows = colSpots[c1];
        let changed = false;
        for (const r of rows) {
          for (let c = 0; c < N; c++) {
            if (c === c1 || c === c2) continue;
            if (g[r][c] === null && (cands[r + '_' + c] || []).includes(v)) {
              const key = r + '_' + c + '_' + v;
              if (!eliminated.has(key)) { eliminated.add(key); changed = true; }
            }
          }
        }
        if (changed) return true;
      }
    }
  }
  return false;
}

// --- Negative-Ziel-Pruning (Stufe 2) ---
function applyNegativeGoalPruningOn(g, eliminated) {
  if (!NEGATIVE_GOALS || NEGATIVE_GOALS.length === 0) return false;
  const cands = candidatesGridOn(g, eliminated);
  let changed = false;
  for (const ng of NEGATIVE_GOALS) {
    const symset = new Set(ng.symbols);
    const fixedCount = countNegativeAdjacencyOn(g, ng.symbols);
    if (fixedCount < ng.max_count) continue;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (g[r][c] !== null) continue;
        const hasFixedNeighbor = neighborsOf(r, c).some(([nr, nc]) => g[nr][nc] !== null && symset.has(g[nr][nc]));
        if (!hasFixedNeighbor) continue;
        for (const v of (cands[r + '_' + c] || [])) {
          if (symset.has(v)) {
            const key = r + '_' + c + '_' + v;
            if (!eliminated.has(key)) { eliminated.add(key); changed = true; }
          }
        }
      }
    }
  }
  return changed;
}

// --- Ziel-Deduktion (Stufe 4, Hofgefluester-spezifisch) ---
// Nur anwendbar, wenn hoechstens maxEmptyCells leere Zellen uebrig sind
// (Endspiel-Faelle) - siehe Kommentar oben. Probiert alle gueltigen
// Vervollstaendigungen der leeren Zellen durch; wenn ALLE davon, die
// zusaetzlich alle Ziele (positiv + negativ) erfuellen, eine Zelle auf
// denselben Wert festlegen (waehrend das ohne Ziel-Bedingung nicht so
// waere), wird das als Hinweis zurueckgegeben. Wird die Aufzaehlung
// abgeschnitten, gilt das NICHT als verlaessliche Deduktion.
function applyGoalDeductionOn(g, eliminated, maxEmptyCells = 8, maxCompletions = 3000) {
  if (!GOALS || GOALS.length === 0) return null;

  const emptyCells = [];
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (g[r][c] === null) emptyCells.push([r, c]);

  if (emptyCells.length === 0 || emptyCells.length > maxEmptyCells) return null;

  const cands = candidatesGridOn(g, eliminated);
  const completions = [];
  let truncated = false;

  function backtrack(idx) {
    if (completions.length >= maxCompletions) { truncated = true; return; }
    if (idx === emptyCells.length) {
      const comp = {};
      for (const [r, c] of emptyCells) comp[r + '_' + c] = g[r][c];
      completions.push(comp);
      return;
    }
    const [r, c] = emptyCells[idx];
    const options = cands[r + '_' + c] || SYMBOLS.map(s => s.id);
    for (const v of options) {
      g[r][c] = v;
      if (rowOkOn(g, r) && colOkOn(g, c) && boxOkOn(g, r, c)) {
        backtrack(idx + 1);
      }
      g[r][c] = null;
      if (completions.length >= maxCompletions) { truncated = true; return; }
    }
  }

  backtrack(0);
  if (truncated || completions.length === 0) return null;

  const validCompletions = completions.filter(comp => {
    const temp = g.map(row => row.slice());
    for (const [r, c] of emptyCells) temp[r][c] = comp[r + '_' + c];
    return goalsSatisfiedOn(temp, GOALS, NEGATIVE_GOALS);
  });

  if (validCompletions.length === 0) return null;

  for (const [r, c] of emptyCells) {
    const key = r + '_' + c;
    const goalValues = new Set(validCompletions.map(comp => comp[key]));
    if (goalValues.size === 1) {
      const allValues = new Set(completions.map(comp => comp[key]));
      if (allValues.size > 1) {
        const value = [...goalValues][0];
        g[r][c] = value;
        return { r, c, value };
      }
    }
  }
  return null;
}

// --- Gesamter Hinweis-Ablauf: simuliert den "menschlichen" Solver bis
// entweder eine Zelle sicher gesetzt werden kann (der eigentliche Hinweis)
// oder keine Technik mehr greift. ---
function findHint() {
  const g = grid.map(row => row.slice());
  const eliminated = new Set();

  for (let step = 0; step < 400; step++) {
    if (g.every(row => row.every(v => v !== null))) return null;

    let res = applyNakedSingleOn(g, eliminated);
    if (res === 'contradiction') return null;
    if (res) return res;

    res = applyHiddenSingleOn(g, eliminated);
    if (res) return res;

    if (applyNegativeGoalPruningOn(g, eliminated)) continue;
    if (applyLockedCandidatesOn(g, eliminated)) continue;
    if (applyNakedSubsetOn(g, eliminated, 2)) continue;
    if (applyHiddenSubsetOn(g, eliminated, 2)) continue;
    if (applyNakedSubsetOn(g, eliminated, 3)) continue;
    if (applyHiddenSubsetOn(g, eliminated, 3)) continue;
    if (applyXWingOn(g, eliminated)) continue;

    res = applyGoalDeductionOn(g, eliminated);
    if (res) return res;

    return null; // keine Technik greift mehr - nur durch Raten fortsetzbar
  }
  return null;
}

function updateHintCountDisplay() {
  const el = document.getElementById('hintCount');
  if (el) el.textContent = hintsUsed;
}

function updateAll() {
  let allGoalsMet = GOALS.length > 0;

  GOALS.forEach((goal, idx) => {
    const count = countChain(goal.chain);
    const countEl = document.getElementById(`goalCount_${idx}`);
    const barEl = document.getElementById(`goalBar_${idx}`);
    if (countEl) countEl.textContent = count;
    if (barEl) {
      barEl.style.width = Math.min(100, (count / goal.target_count) * 100) + '%';
      barEl.classList.toggle('done', count === goal.target_count);
    }
    if (count !== goal.target_count) allGoalsMet = false;
  });

  let allNegativeGoalsMet = true;
  NEGATIVE_GOALS.forEach((ng, idx) => {
    const count = countNegativeAdjacency(ng.symbols);
    const countEl = document.getElementById(`negGoalCount_${idx}`);
    const barEl = document.getElementById(`negGoalBar_${idx}`);
    const exceeded = count > ng.max_count;
    if (countEl) {
      countEl.textContent = count;
      countEl.classList.toggle('exceeded', exceeded);
    }
    if (barEl) {
      barEl.style.width = Math.min(100, (count / Math.max(ng.max_count, 1)) * 100) + '%';
      barEl.classList.toggle('exceeded', exceeded);
    }
    if (exceeded) allNegativeGoalsMet = false;
  });

  const winBanner = document.getElementById('winBanner');
  const solved = isFull() && !hasAnyConflict() && allGoalsMet && allNegativeGoalsMet;
  if (solved) {
    winBanner.innerHTML = `🎉 Hof komplett! Alle Regeln und Ziele erfüllt.<div class="win-banner-hints">💡 Du hast ${hintsUsed} Hinweis${hintsUsed === 1 ? '' : 'e'} genutzt.</div>`;
    winBanner.classList.add('show');
    if (currentLevel?.story_outro && !outroShown) {
      outroShown = true;
      showStoryModal(currentLevel.story_outro, 'Hof abgeschlossen');
    }
  } else {
    winBanner.classList.remove('show');
  }
  const hintBtnEl = document.getElementById('hintBtn');
  if (hintBtnEl) hintBtnEl.disabled = solved;
}

document.getElementById('hintBtn').addEventListener('click', () => {
  refreshCells();
  if (isFull() && !hasAnyConflict()) {
    alert('Das Feld ist bereits komplett gefüllt.');
    return;
  }
  if (hasAnyConflict()) {
    alert('Bitte behebe zuerst die rot markierten Konflikte, bevor du einen Hinweis anforderst.');
    return;
  }
  const hint = findHint();
  if (!hint) {
    alert(
      'Für den aktuellen Stand gibt es keinen Hinweis über reine Logik (Naked/Hidden Single, ' +
      'Locked Candidates, Paare/Tripel, X-Wing, Ziel-Deduktion) - an dieser Stelle würde es Raten ' +
      'erfordern. Das kann auch daran liegen, dass eine frühere eigene Eingabe zwar gültig, aber ' +
      'nicht die tatsächliche Lösung war.'
    );
    return;
  }

  grid[hint.r][hint.c] = hint.value;
  notes[hint.r][hint.c].clear();
  hintsUsed++;
  updateHintCountDisplay();
  refreshCells();
  updateAll();

  const cellEl = document.querySelector(`.cell[data-r="${hint.r}"][data-c="${hint.c}"]`);
  if (cellEl) {
    cellEl.classList.add('hint-highlight');
    setTimeout(() => cellEl.classList.remove('hint-highlight'), 1200);
  }
});

document.getElementById('checkBtn').addEventListener('click', () => {
  refreshCells();
  updateAll();
  if (!isFull()) {
    alert('Das Feld ist noch nicht komplett gefüllt.');
  } else if (hasAnyConflict()) {
    alert('Es gibt noch Wiederholungen in einer Zeile, Spalte oder Region (rot markiert).');
  } else {
    const unmet = GOALS
      .map((goal, idx) => ({ goal, count: countChain(goal.chain) }))
      .filter(({ goal, count }) => count !== goal.target_count);
    const exceeded = NEGATIVE_GOALS
      .map(ng => ({ ng, count: countNegativeAdjacency(ng.symbols) }))
      .filter(({ ng, count }) => count > ng.max_count);
    if (unmet.length === 0 && exceeded.length === 0) {
      alert('Alles richtig! Der Hof ist fertig eingerichtet. 🎉');
    } else {
      const details = [
        ...unmet.map(({ goal, count }) => `${chainToText(goal.chain)}: ${count}/${goal.target_count}`),
        ...exceeded.map(({ ng, count }) => `🚫 ${symbolSetToText(ng.symbols)}: ${count}x (max. erlaubt: ${ng.max_count}x)`),
      ].join('\n');
      alert('Sudoku-Regeln erfüllt, aber diese Ziele stimmen noch nicht:\n' + details);
    }
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Wirklich alle eigenen Eingaben zurücksetzen?')) {
    if (currentLevel) applyLevel(currentLevel);
  }
});

document.getElementById('notesBtn').addEventListener('click', () => {
  notesMode = !notesMode;
  document.getElementById('notesBtn').classList.toggle('active', notesMode);
});

// Tastatur-Support: Zifferntasten 1-9 platzieren das jeweilige Symbol (bzw.
// toggeln eine Notiz, wenn der Notizen-Modus aktiv ist), Backspace/Entf loescht.
document.addEventListener('keydown', (e) => {
  if (!selected) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= 9 && SYMBOLS[num-1]) {
    highlightSymbol = SYMBOLS[num-1].id;
    placeSymbol(SYMBOLS[num-1].id);
  }
  if (e.key === 'Backspace' || e.key === 'Delete') placeSymbol(null);
});

init();
</script>
